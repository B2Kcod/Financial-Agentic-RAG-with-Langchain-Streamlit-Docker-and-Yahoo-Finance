version: "3.8"

services:
  # Main application service
  app:
    profiles: ["cpu", "gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      # Target build stage switches depending on profile
      target: ${BUILD_TARGET:-cpu}
    volumes:
      - ./:/app
      - huggingface_cache:/root/.cache/huggingface
      - vectorstores:/app/vectorstores
      - model_cache:/app/model_cache
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Ollama model service
  ollama:
    profiles: ["cpu", "gpu"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
      - model_cache:/root/.cache/ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5; ollama pull ${OLLAMA_MODEL}; wait %1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  huggingface_cache:
  ollama_models:
  vectorstores:
  model_cache:
