# Specify Docker Compose version for compatibility.
version: "3.8"
services:
  # Main application service.
  app:
    build:
      # Build context is the current directory.
      context: .
      # Use the Dockerfile and target the 'cpu' stage.
      dockerfile: Dockerfile
      target: cpu
    # Mount the local directory to /app in the container and cache for Hugging Face models.
    volumes:
      - ./:/app
      - huggingface_cache:/root/.cache/huggingface
    # Map port 8000 on the host to port 8000 in the container.
    ports:
      - "8000:8000"
    # Load environment variables from the .env file.
    env_file:
      - .env
    # Set the OLLAMA_HOST environment variable to point to the Ollama service.
    environment:
      - OLLAMA_HOST=http://ollama:11434
    # Ensure the app service starts after the Ollama service.
    depends_on:
      - ollama

  # Ollama service for running the language model.
  ollama:
    # Use the latest Ollama image.
    image: ollama/ollama:latest
    # Mount a volume for persisting Ollama models.
    volumes:
      - ollama_models:/root/.ollama
    # Map port 11434 on the host to port 11434 in the container.
    ports:
      - "11434:11434"
    # Restart the service unless explicitly stopped.
    restart: unless-stopped
    # Start the Ollama server, pull the specified model, and wait for the server to be ready.
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5; ollama pull ${OLLAMA_MODEL}; wait %1"

# Define named volumes for persistence.
volumes:
  huggingface_cache:
  ollama_models: